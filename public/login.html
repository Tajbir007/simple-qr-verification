<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="login-card w-full max-w-md">
    <h1 class="text-3xl font-bold text-center">Admin Login</h1>
    <form id="login-form" class="space-y-4">
      <input type="text" id="username" placeholder="Username" required class="w-full border p-2">
      <input type="password" id="password" placeholder="Password" required class="w-full border p-2">
      <button type="submit" class="w-full bg-green-600 text-white py-2 rounded">Login</button>
    </form>
    <div id="message" class="hidden mt-4 text-red-600"></div>
  </div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const messageDiv = document.getElementById('message');
  const API_BASE = window.location.origin;
  try {
    const response = await fetch(`${API_BASE}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await response.json();
    if (response.ok) {
      sessionStorage.setItem('authToken', data.token);
      window.location.href = '/admin.html';
    } else {
      messageDiv.textContent = data.message || 'Login failed';
      messageDiv.classList.remove('hidden');
    }
  } catch (err) {
    messageDiv.textContent = 'Failed to connect to the server.';
    messageDiv.classList.remove('hidden');
  }
});
</script>
</body>
</html>
