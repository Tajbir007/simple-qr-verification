<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
  <div id="app" class="bg-white rounded p-6 max-w-2xl mx-auto shadow">
    <h1 class="text-2xl font-bold mb-4">Ticket Dashboard</h1>
    <button id="logout-btn" class="mb-4 bg-red-500 text-white px-3 py-1 rounded">Logout</button>
    <div id="ticket-holders-container"></div>
    <button id="add-btn" class="bg-blue-500 text-white px-3 py-1 rounded">Add Ticket</button>
    <button id="generate-btn" class="bg-green-500 text-white px-3 py-1 rounded">Generate</button>
    <div id="qr-codes-display" class="grid grid-cols-2 gap-4 mt-4"></div>
  </div>
<script>
const API_BASE = window.location.origin;
const token = sessionStorage.getItem('authToken');
if (!token) window.location.href = '/login.html';
document.getElementById('logout-btn').addEventListener('click', ()=>{
  sessionStorage.removeItem('authToken');
  window.location.href = '/login.html';
});
async function fetchAllTickets() {
  try {
    const res = await fetch(`${API_BASE}/api/tickets`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await res.json();
    if (res.ok) {
      const container = document.getElementById('qr-codes-display');
      container.innerHTML = '';
      data.tickets.forEach(t=>{
        const div = document.createElement('div');
        div.className = 'p-2 border rounded';
        div.innerHTML = `<p>${t.name}</p><p>${t.email}</p><p>Status: ${t.status}</p>
          <button onclick="resetTicket('${t.id}')">Reset</button>
          <button onclick="deleteTicket('${t.id}')">Delete</button>`;
        container.appendChild(div);
      });
    }
  } catch (err) {
    console.error(err);
  }
}
async function resetTicket(id) {
  await fetch(`${API_BASE}/api/reset-ticket/${id}`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
  fetchAllTickets();
}
async function deleteTicket(id) {
  await fetch(`${API_BASE}/api/delete-ticket/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
  fetchAllTickets();
}
document.getElementById('add-btn').addEventListener('click', ()=>{
  const container = document.getElementById('ticket-holders-container');
  const div = document.createElement('div');
  div.innerHTML = '<input type="text" placeholder="Name"> <input type="email" placeholder="Email"> <input type="tel" placeholder="Phone">';
  container.appendChild(div);
});
document.getElementById('generate-btn').addEventListener('click', async ()=>{
  const holders = Array.from(document.querySelectorAll('#ticket-holders-container div')).map(div=>({
    name: div.querySelector('input[type=text]').value,
    email: div.querySelector('input[type=email]').value,
    phone: div.querySelector('input[type=tel]').value
  }));
  await fetch(`${API_BASE}/api/generate-tickets`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json','Authorization':`Bearer ${token}` },
    body: JSON.stringify({ ticketHolders: holders })
  });
  fetchAllTickets();
});
fetchAllTickets();
</script>
</body>
</html>
