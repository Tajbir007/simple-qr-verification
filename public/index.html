<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
  <div id="app" class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-8 flex flex-col items-center text-center">
    <h1 class="text-3xl font-bold text-gray-800 mb-2">Ticket Verification</h1>
    <p class="text-gray-500 mb-8">Scanning your QR code for validation.</p>
    <div id="loading" class="flex flex-col items-center">
      <div class="spinner mb-4"></div>
      <p class="text-lg text-gray-600 font-medium">Verifying...</p>
    </div>
    <div id="result-container" class="hidden w-full flex flex-col items-center"></div>
  </div>
<script>
function renderResult(status, data = null) {
  const resultContainer = document.getElementById('result-container');
  resultContainer.innerHTML = '';
  resultContainer.classList.remove('hidden');
  document.getElementById('loading').classList.add('hidden');
  let statusText, detailsHtml = '';
  if (status === 'authentic') {
    statusText = 'Authentic';
    detailsHtml = `<p><strong>Name:</strong> ${data.name}</p>
                   <p><strong>Email:</strong> ${data.email}</p>
                   <p><strong>Phone:</strong> ${data.phone}</p>`;
  } else if (status === 'used') {
    statusText = 'Already Used';
  } else if (status === 'not-found') {
    statusText = 'Not Found';
  } else {
    statusText = 'Error';
  }
  resultContainer.innerHTML = `<h2 class="text-2xl font-bold">${statusText}</h2>${detailsHtml}`;
}
async function verifyTicket() {
  const urlParams = new URLSearchParams(window.location.search);
  const ticketId = urlParams.get('id');
  const API_BASE = window.location.origin;
  try {
    const response = await fetch(`${API_BASE}/api/verify/${ticketId}`);
    const result = await response.json();
    if (response.ok) renderResult(result.status, result.data);
    else renderResult('not-found');
  } catch (err) {
    renderResult('error');
  }
}
document.addEventListener('DOMContentLoaded', verifyTicket);
</script>
</body>
</html>
